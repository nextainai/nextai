<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Wave Background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), rgba(0, 123, 255, 0.2));
            opacity: 0.4;
            z-index: 0;
            animation: wave 12s infinite linear;
        }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Particle Background */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top Bar */
        .top-bar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6em;
            font-weight: bold;
            color: #fff;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .top-bar .logo {
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 8px #fff, 0 0 15px #00c6ff, 0 0 20px #00c6ff; }
            to { text-shadow: 0 0 12px #fff, 0 0 25px #00c6ff, 0 0 35px #00c6ff; }
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: calc(100vh - 120px); /* Full height minus top and bottom bars */
            overflow-y: auto; /* Ensure scrolling works */
            z-index: 2;
            border: 3px solid transparent;
            border-image: linear-gradient(45deg, #00c6ff, #ff00ff) 1;
            box-shadow: 0 0 25px rgba(0, 198, 255, 0.7);
            animation: borderGlow 2.5s ease-in-out infinite alternate;
            position: absolute;
            top: 60px;
            bottom: 60px; /* Align with fixed bars */
            left: 0;
            right: 0;
            padding: 0; /* Remove any padding to ensure full edge */
        }

        @keyframes borderGlow {
            from { box-shadow: 0 0 15px rgba(0, 198, 255, 0.5); }
            to { box-shadow: 0 0 30px rgba(0, 198, 255, 0.9); }
        }

        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .chat-content::-webkit-scrollbar {
            width: 8px;
        }

        .chat-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        /* Messages */
        .message {
            margin: 15px 0;
            display: flex;
            align-items: flex-end;
            max-width: 80%;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.6s ease forwards;
        }

        .message.user {
            justify-content: flex-end;
            margin-left: auto;
        }

        .message.bot {
            justify-content: flex-start;
            margin-right: auto;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 25px;
            word-wrap: break-word;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            max-width: calc(100% - 60px);
            backdrop-filter: blur(8px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .message.bot .bubble {
            animation: typing 1.2s ease-in-out;
        }

        .message.user .bubble {
            background: #00c6ff;
        }

        .bubble:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 20px rgba(0, 198, 255, 0.7);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes typing {
            0% { transform: scale(0.9); opacity: 0.3; }
            100% { transform: scale(1); opacity: 1; }
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin: 0 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.4);
            background: #00c6ff; /* Enhanced with a solid color */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #fff;
        }

        .message.user .avatar {
            margin-left: 12px;
        }

        .message.bot .avatar {
            margin-right: 12px;
        }

        /* Loading Animation */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            max-width: 40%;
            color: #fff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        .dots {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.3s; }
        .dot:nth-child(3) { animation-delay: 0.6s; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.3);
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 1000;
        }

        .bottom-bar input {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            margin-right: 12px;
            outline: none;
        }

        .bottom-bar input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .bottom-bar .send-btn {
            padding: 12px;
            border: none;
            border-radius: 50%;
            font-size: 1.4em;
            background: #00c6ff;
            color: #fff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, background 0.3s;
            animation: pulse 1.5s infinite;
        }

        .bottom-bar .send-btn:hover {
            background: #0099cc;
            transform: scale(1.2);
        }

        .bottom-bar .send-btn:active {
            animation: none;
            transform: rotate(360deg) scale(1);
        }

        .bottom-bar .send-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .bottom-bar .send-btn:active::after {
            width: 80px;
            height: 80px;
            opacity: 0;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 198, 255, 0.8); }
            70% { box-shadow: 0 0 0 12px rgba(0, 198, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 198, 255, 0); }
        }

        /* Code Block Styling */
        .code-block {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
            overflow: auto;
            font-family: monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #fff;
        }

        .copy-button, .copy-button-inline {
            background: transparent;
            color: #fff;
            border: none;
            padding: 0;
            cursor: pointer;
            margin-left: 12px;
            font-size: 20px;
            transition: color 0.3s;
        }

        .copy-button:hover, .copy-button-inline:hover {
            color: #00c6ff;
        }
    </style>
</head>
<body>
    <!-- Particle Background -->
    <div id="particles-js"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <span class="logo">NEXT-1</span>
    </div>

    <!-- Chat Area -->
    <div class="chat-container">
        <div id="chat-content" class="chat-content"></div>
    </div>

    <!-- Bottom Bar -->
    <form id="chat-form" class="bottom-bar">
        <input id="user-input" type="text" placeholder="Type your message..." autocomplete="off">
        <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i></button>
    </form>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Particle.js Configuration (Optimized)
        particlesJS("particles-js", {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: ["#ffffff", "#00c6ff", "#ff00ff"] },
                shape: { type: ["circle", "star"], polygon: { nb_sides: 5 } },
                opacity: { value: 0.7, random: true },
                size: { value: 4, random: true },
                line_linked: { enable: true, distance: 100, color: "#ffffff", opacity: 0.5, width: 1 },
                move: { enable: true, speed: 3, direction: "random", random: true, straight: false, out_mode: "out" }
            },
            interactivity: {
                detect_on: "canvas",
                events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true },
                modes: { grab: { distance: 150, line_linked: { opacity: 0.7 } }, push: { particles_nb: 4 } }
            },
            retina_detect: true
        });
        console.log("Particles.js initialized");

        const chatContent = document.getElementById("chat-content");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");

        const chatGPTLogo = "https://i.ibb.co/Z6dDQpwx/ncizgz.jpg";
        const userLogo = "https://i.ibb.co/ssQNvBC/67373290.jpg";

        // Parse Markdown
        function parseMarkdown(text) {
            text = text.replace(/```([\s\S]*?)```/g, (match, code) => {
                const codeWithoutLanguage = code.split('\n').slice(1).join('\n');
                return `<pre class="code-block"><code>${escapeHtml(code)}</code><button class="copy-button" data-code="${encodeURIComponent(codeWithoutLanguage)}"><i class="fa fa-copy"></i></button></pre>`;
            });
            text = text.replace(/`([^`]+)`/g, (match, inlineCode) => `<code>${escapeHtml(inlineCode)}</code><button class="copy-button-inline" data-code="${encodeURIComponent(inlineCode)}"><i class="fa fa-copy"></i></button>`);
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        // Escape HTML
        function escapeHtml(text) {
            return text.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">").replace(/"/g, "\"").replace(/'/g, "'");
        }

        // Copy to Clipboard
        function copyToClipboard(text, button) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            const icon = button.querySelector('i');
            icon.classList.remove('fa-copy');
            icon.classList.add('fa-check');
            setTimeout(() => {
                icon.classList.remove('fa-check');
                icon.classList.add('fa-copy');
            }, 1000);
        }

        // Event Listener for Copy Buttons
        document.addEventListener("click", (event) => {
            const button = event.target.closest('.copy-button, .copy-button-inline');
            if (button) {
                const code = decodeURIComponent(button.getAttribute('data-code'));
                copyToClipboard(code, button);
            }
        });

        // Create Message Element
        function createMessageElement(message, fromUser, isLoading = false) {
            const messageWrapper = document.createElement("div");
            messageWrapper.classList.add("message", fromUser ? "user" : "bot");

            const avatar = document.createElement("div"); // Using div for custom styling
            avatar.classList.add("avatar");
            avatar.style.background = fromUser ? '#00c6ff' : 'linear-gradient(45deg, #00c6ff, #ff00ff)';
            avatar.innerHTML = fromUser ? 'U' : 'N'; // Initials for user and NEXT AI

            const bubble = document.createElement("div");
            if (isLoading) {
                bubble.classList.add("loading");
                bubble.innerHTML = `<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            } else {
                bubble.classList.add("bubble");
                bubble.innerHTML = parseMarkdown(message);
            }

            messageWrapper.appendChild(fromUser ? bubble : avatar);
            messageWrapper.appendChild(fromUser ? avatar : bubble);
            return messageWrapper;
        }

        // Fetch Response from API
        async function fetchResponse(userMessage) {
            try {
                const response = await fetch("https://backend.buildpicoapps.com/aero/run/llm-api?pk=v1-Z0FBQUFBQm5IZkJDMlNyYUVUTjIyZVN3UWFNX3BFTU85SWpCM2NUMUk3T2dxejhLSzBhNWNMMXNzZlp3c09BSTR6YW1Sc1BmdGNTVk1GY0liT1RoWDZZX1lNZlZ0Z1dqd3c9PQ==", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: userMessage })
                });
                if (!response.ok) throw new Error('Failed to fetch response');
                const data = await response.json();
                if (data.status === "success") return data.text;
                throw new Error('Error in response data');
            } catch (error) {
                console.error("Error:", error);
                return "There was an error. Please try again later.";
            }
        }

        // Debounce Form Submission
        let isSubmitting = false;
        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (isSubmitting) return;
            isSubmitting = true;

            const userMessage = userInput.value.trim();
            if (!userMessage) {
                isSubmitting = false;
                return;
            }

            chatContent.appendChild(createMessageElement(userMessage, true));
            userInput.value = "";
            autoScroll();

            const loadingMessage = createMessageElement("", false, true);
            chatContent.appendChild(loadingMessage);
            autoScroll();

            const botResponse = await fetchResponse(userMessage);
            chatContent.removeChild(loadingMessage);
            chatContent.appendChild(createMessageElement(botResponse, false));
            autoScroll();

            isSubmitting = false;
        });

        // Optimized Auto-Scroll
        function autoScroll() {
            requestAnimationFrame(() => {
                const maxScroll = chatContent.scrollHeight - chatContent.clientHeight;
                if (maxScroll > 0) {
                    chatContent.scrollTo({ top: maxScroll, behavior: 'smooth' });
                }
            });
        }

        // Initial Welcome Message
        window.addEventListener('load', () => {
            setTimeout(() => {
                const welcomeMessage = createMessageElement("How can I help you today?", false);
                chatContent.appendChild(welcomeMessage);
                autoScroll();
            }, 100);
        });
    </script>
</body>
</html>
