<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .top-bar {
            background: #333;
            padding: 15px 20px;
            font-size: 1.5em;
            font-weight: bold;
            text-align: left;
            border-bottom: 1px solid #444;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 60px;
            margin-bottom: 60px;
            overflow: hidden;
        }

        .chat-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            scroll-behavior: smooth;
        }

        .chat-content::-webkit-scrollbar {
            width: 6px;
        }

        .chat-content::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            display: flex;
            align-items: flex-end;
            max-width: 80%;
        }

        .message.user {
            justify-content: flex-end;
            margin-left: auto;
        }

        .message.bot {
            justify-content: flex-start;
            margin-right: auto;
        }

        .bubble {
            padding: 10px 15px;
            border-radius: 20px;
            background: #333;
            color: #fff;
            max-width: calc(100% - 50px);
        }

        .message.user .bubble {
            background: #007BFF;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 10px;
        }

        .message.user .avatar {
            margin-left: 10px;
        }

        .message.bot .avatar {
            margin-right: 10px;
        }

        .loading {
            padding: 10px 15px;
            background: #333;
            border-radius: 20px;
            max-width: 40%;
        }

        .dots {
            display: flex;
            gap: 5px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1.4s infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        .bottom-bar {
            display: flex;
            align-items: center;
            background: #333;
            padding: 10px;
            border-top: 1px solid #444;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .bottom-bar input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #555;
            border-radius: 20px;
            background: #444;
            color: #fff;
            margin-right: 10px;
            outline: none;
        }

        .bottom-bar input::placeholder {
            color: #aaa;
        }

        .bottom-bar button {
            padding: 10px;
            border: none;
            border-radius: 50%;
            background: #007BFF;
            color: #fff;
            cursor: pointer;
        }

        .bottom-bar button:hover {
            background: #0056b3;
        }

        .code-block {
            background: #222;
            padding: 10px;
            border-radius: 5px;
            margin: 5px 0;
            overflow: auto;
            font-family: monospace;
            color: #fff;
        }

        .copy-button, .copy-button-inline {
            background: transparent;
            color: #fff;
            border: none;
            cursor: pointer;
            margin-left: 10px;
            font-size: 18px;
        }

        .copy-button:hover, .copy-button-inline:hover {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="top-bar">NEXT-1</div>
    <div class="chat-container">
        <div id="chat-content" class="chat-content"></div>
    </div>
    <form id="chat-form" class="bottom-bar">
        <input id="user-input" type="text" placeholder="Type your message..." autocomplete="off">
        <button type="submit"><i class="fas fa-paper-plane"></i></button>
    </form>
    <script>
        const chatContent = document.getElementById("chat-content");
        const chatForm = document.getElementById("chat-form");
        const userInput = document.getElementById("user-input");

        const chatGPTLogo = "https://i.ibb.co/Z6dDQpwx/ncizgz.jpg";
        const userLogo = "https://i.ibb.co/ssQNvBC/67373290.jpg";

        function parseMarkdown(text) {
            text = text.replace(/```([\s\S]*?)```/g, (match, code) => {
                const codeWithoutLanguage = code.split('\n').slice(1).join('\n');
                return `<pre class="code-block"><code>${escapeHtml(code)}</code><button class="copy-button" data-code="${encodeURIComponent(codeWithoutLanguage)}"><i class="fa fa-copy"></i></button></pre>`;
            });
            text = text.replace(/`([^`]+)`/g, (match, code) => `<code>${escapeHtml(code)}</code><button class="copy-button-inline" data-code="${encodeURIComponent(code)}"><i class="fa fa-copy"></i></button>`);
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function copyToClipboard(text, button) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            const icon = button.querySelector('i');
            icon.classList.remove('fa-copy');
            icon.classList.add('fa-check');
            setTimeout(() => {
                icon.classList.remove('fa-check');
                icon.classList.add('fa-copy');
            }, 1000);
        }

        document.addEventListener("click", (event) => {
            const button = event.target.closest('.copy-button, .copy-button-inline');
            if (button) {
                const code = decodeURIComponent(button.getAttribute('data-code'));
                copyToClipboard(code, button);
            }
        });

        function createMessageElement(message, fromUser, isLoading = false) {
            const messageWrapper = document.createElement("div");
            messageWrapper.classList.add("message", fromUser ? "user" : "bot");

            const avatar = document.createElement("img");
            avatar.src = fromUser ? userLogo : chatGPTLogo;
            avatar.alt = fromUser ? "User" : "ChatGPT";
            avatar.classList.add("avatar");

            const bubble = document.createElement("div");
            if (isLoading) {
                bubble.classList.add("loading");
                bubble.innerHTML = `<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            } else {
                bubble.classList.add("bubble");
                bubble.innerHTML = parseMarkdown(message);
            }

            messageWrapper.appendChild(fromUser ? bubble : avatar);
            messageWrapper.appendChild(fromUser ? avatar : bubble);
            return messageWrapper;
        }

        async function fetchResponse(userMessage) {
            try {
                const response = await fetch("https://backend.buildpicoapps.com/aero/run/llm-api?pk=v1-Z0FBQUFBQm5IZkJDMlNyYUVUTjIyZVN3UWFNX3BFTU85SWpCM2NUMUk3T2dxejhLSzBhNWNMMXNzZlp3c09BSTR6YW1Sc1BmdGNTVk1GY0liT1RoWDZZX1lNZlZ0Z1dqd3c9PQ==", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: userMessage })
                });
                if (!response.ok) throw new Error('Failed to fetch response');
                const data = await response.json();
                if (data.status === "success") return data.text;
                throw new Error('Error in response data');
            } catch (error) {
                console.error("Error:", error);
                return "There was an error. Please try again later.";
            }
        }

        chatForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const userMessage = userInput.value.trim();
            if (!userMessage) return;

            chatContent.appendChild(createMessageElement(userMessage, true));
            userInput.value = "";
            chatContent.scrollTop = chatContent.scrollHeight;

            const loadingMessage = createMessageElement("", false, true);
            chatContent.appendChild(loadingMessage);
            chatContent.scrollTop = chatContent.scrollHeight;

            const botResponse = await fetchResponse(userMessage);
            chatContent.removeChild(loadingMessage);
            chatContent.appendChild(createMessageElement(botResponse, false));
            chatContent.scrollTop = chatContent.scrollHeight;
        });

        window.addEventListener('load', () => {
            setTimeout(() => {
                const welcomeMessage = createMessageElement("How can I help you today?", false);
                chatContent.appendChild(welcomeMessage);
                chatContent.scrollTop = chatContent.scrollHeight;
            }, 100);
        });
    </script>
</body>
</html>
