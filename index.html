<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXT AI</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }body.light-mode {
        background-color: #fff;
        color: #000;
    }

    body.dark-mode {
        background-color: #121212;
        color: #f0f0f0;
    }

    .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 20px;
        font-size: 1.5em;
        font-weight: bold;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.1);
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 1000;
    }

    .chat-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        margin-top: 60px;
        margin-bottom: 60px;
        overflow: hidden;
    }

    .chat-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        scroll-behavior: smooth;
    }

    .message {
        display: flex;
        align-items: flex-end;
        margin: 10px 0;
        max-width: 80%;
    }

    .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .bubble {
        padding: 10px 15px;
        border-radius: 20px;
        word-wrap: break-word;
        background-color: #f0f0f0;
        color: #000;
        box-shadow: 0px 2px 2px rgba(0, 0, 0, 0.1);
    }

    .message.user .bubble {
        background-color: #007BFF;
        color: #fff;
    }

    .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 0 10px;
    }

    .bottom-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        box-shadow: 0px -2px 2px rgba(0, 0, 0, 0.1);
        position: fixed;
        bottom: 0;
        width: 100%;
    }

    .bottom-bar input {
        flex: 1;
        padding: 10px 15px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 20px;
        font-size: 1em;
        margin-right: 10px;
    }

    .bottom-bar button {
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        font-size: 1em;
        background-color: #007BFF;
        color: #fff;
        cursor: pointer;
    }

    .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 15px;
        border-radius: 20px;
        max-width: 40%;
    }

    .dots {
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background-color: #000;
        border-radius: 50%;
        animation: blink 1.4s infinite;
    }

    .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes blink {
        0%, 80%, 100% { opacity: 0; }
        40% { opacity: 1; }
    }
</style>

</head>
<body class="light-mode">
    <div class="top-bar">
        NEXT-1
        <button id="mode-toggle" style="font-size: 0.7em; background: none; border: none; cursor: pointer;">
            <i class="fas fa-moon"></i>
        </button>
    </div><div class="chat-container">
    <div id="chat-content" class="chat-content"></div>
</div>

<form id="chat-form" class="bottom-bar">
    <input id="user-input" type="text" placeholder="Type your message..." autocomplete="off">
    <button type="submit">Send</button>
</form>

<script>
    const chatContent = document.getElementById("chat-content");
    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const modeToggle = document.getElementById("mode-toggle");

    const userLogo = "https://i.ibb.co/ssQNvBC/67373290.jpg";
    const botLogo = "https://i.ibb.co/Z6dDQpwx/ncizgz.jpg";

    function scrollToBottom() {
        chatContent.scrollTop = chatContent.scrollHeight;
    }

    function createMessageElement(message, fromUser, isLoading = false) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${fromUser ? 'user' : 'bot'}`;

        const avatar = document.createElement("img");
        avatar.src = fromUser ? userLogo : botLogo;
        avatar.className = "avatar";

        const bubble = document.createElement("div");
        bubble.className = isLoading ? "loading" : "bubble";
        bubble.innerHTML = isLoading ? `<div class='dots'><div class='dot'></div><div class='dot'></div><div class='dot'></div></div>` : message;

        wrapper.appendChild(fromUser ? bubble : avatar);
        wrapper.appendChild(fromUser ? avatar : bubble);

        return wrapper;
    }

    async function typeText(element, text) {
        element.innerHTML = '';
        for (let char of text) {
            element.innerHTML += char;
            scrollToBottom();
            await new Promise(r => setTimeout(r, 10));
        }
    }

    async function fetchResponse(message) {
        try {
            const res = await fetch("https://backend.buildpicoapps.com/aero/run/llm-api?pk=demo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: message })
            });
            const data = await res.json();
            return data.text || "No response";
        } catch {
            return "Error fetching response.";
        }
    }

    chatForm.addEventListener("submit", async e => {
        e.preventDefault();
        const msg = userInput.value.trim();
        if (!msg) return;
        userInput.value = '';

        chatContent.appendChild(createMessageElement(msg, true));
        const loader = createMessageElement("", false, true);
        chatContent.appendChild(loader);
        scrollToBottom();

        const response = await fetchResponse(msg);
        chatContent.removeChild(loader);

        const wrapper = document.createElement("div");
        wrapper.className = "message bot";
        const avatar = document.createElement("img");
        avatar.src = botLogo;
        avatar.className = "avatar";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        wrapper.appendChild(avatar);
        wrapper.appendChild(bubble);
        chatContent.appendChild(wrapper);

        await typeText(bubble, response);
    });

    modeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");
        document.body.classList.toggle("light-mode");
        const icon = modeToggle.querySelector("i");
        icon.classList.toggle("fa-sun");
        icon.classList.toggle("fa-moon");
    });

    window.addEventListener("load", () => {
        chatContent.appendChild(createMessageElement("How can I help you today?", false));
        scrollToBottom();
    });
</script>

</body>
</html>
